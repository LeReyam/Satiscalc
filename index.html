<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productionplanner introduction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<header id="start">
		<h1>Productionplanner</h1>
		<nav>
			<a href="#start">Start</a>
			<a href="#planner">Planner</a>
			<a href="about.html">About</a>
		</nav>
	</header>
	<hr>
	<main id="planner">
		<section>
			<form id="selection">
				<label for="rezept">Wähle das Rezept:</label>
				<select name="rezept" id="rezept">
					<option value="Alien DNA Capsule">Alien DNA Capsule</option>
					<option value="Alumium Casing">Aluminium Casing</option>
				</select>
				<br><br>
				<label id="menge">Gebe die gewünschte Anzahl ein:</label>
				<p><input type="number" value="1" min="1">/s</p>
				<button type="submit">Berechnen</button>
			</form>
		</section>
		<section class="image-viewer">
			<stage class="image-stage">
				<img id="image" src="flowchart.png" alt="flowchart">
			</stage>
		</section>
	</main>
	<hr>
	<footer id="ende">
			<ul>
				<li>
				Ersteller:
				<ul>
					<li>L.Mayer</li>
					<li>N.Plötz</li>
					<li>F.Dunstheimer</li>
				</ul>
				</li>
				<li><a href="https://github.com/LeReyam/Satiscalc">Unser Repository</a></li>
			</ul>
	</footer>

</body>
</html>
